name: Android Production Build Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  assemble-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Import Workspace Source Files
        uses: actions/checkout@v4

      - name: Initialize Environment Java JDK 17 Runtime
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Update Local Gradle Binary Execution Flags
        run: chmod +x gradlew

      - name: Compile and Assemble Production Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Finished Artifact Package
        uses: actions/upload-artifact@v4
        with:
          name: GlassRemote-APK
          path: app/build/outputs/apk/debug/*.apk
          
